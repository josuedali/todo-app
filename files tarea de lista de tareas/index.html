<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>TODO APP</h1>
      <button id="theme-toggle" class="theme-btn" aria-label="Cambiar tema">◐</button>
    </header>

    <section class="card">
      <div class="new-task">
        <input id="task-input" type="text" placeholder="Aqui va tu tarea..." autocomplete="off">
        <button id="add-btn" class="add-btn" aria-label="Agregar tarea">+</button>
      </div>
      <p id="error" class="error" hidden>A task must be provided.</p>

      <ul id="task-list" class="task-list"></ul>

      <footer class="counters">
        <span class="badge badge--total" id="total">Total: 0</span>
        <span class="badge badge--done" id="completed">Completed: 0</span>
        <span class="badge badge--pending" id="incompleted">Incompleted: 0</span>
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
